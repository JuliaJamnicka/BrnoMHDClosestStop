name: backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  schedule:
    # Daily: KORDIS publishes new exports (seen on Fridays ~06:30 Prague time), data.Brno copies
    # them weekly, and the trip aliases between the two must follow both
    - cron: '20 5 * * *'
    # Hourly: deploy a new KORDIS export soon after it appears (skipped while it is unchanged)
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      exports_cache_key:
        description: Also keep the KORDIS exports of this older cache (e.g. kordis-exports-<run id>-1) as trip aliases
        required: false
        default: ''

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Whether this run deploys: always, except an hourly run while KORDIS's export is unchanged.
  check:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: backend/data/exports
          key: kordis-exports-${{ github.run_id }}
          restore-keys: kordis-exports-
      - id: check
        env:
          HOURLY: ${{ github.event.schedule == '50 * * * *' }}
        run: |
          modified=$(curl -fsSI https://kordis-jmk.cz/gtfs/gtfs.zip | tr -d '\r' | sed -n 's/^last-modified: //Ip')
          if [ "$HOURLY" = true ] && [ -n "$modified" ] && [ "$modified" = "$(cat backend/data/exports/latest.modified 2>/dev/null)" ]; then
            echo "export unchanged since $modified"
            echo deploy=false >> "$GITHUB_OUTPUT"
          else
            echo deploy=true >> "$GITHUB_OUTPUT"
          fi

  # Deploys to Cloud Run from main (and with every new timetable).
  # Skipped until the repository variables in backend/README.md are set.
  deploy:
    needs: [test, check]
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/mhd/mhd-api:${{ github.sha }}-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # The real-time feed keeps using the trip_ids of an earlier export for days after KORDIS
      # publishes a new one (on 2026-11-06 those of 2026-10-29, two exports back), so the last few
      # exports are kept between runs and mapped as aliases.
      # A manual run can bring back the exports of an older cache (exports_cache_key).
      - if: inputs.exports_cache_key != ''
        uses: actions/cache/restore@v4
        with:
          path: backend/data/exports
          key: ${{ inputs.exports_cache_key }}
      - if: inputs.exports_cache_key != ''
        run: mkdir -p data/import && mv data/exports data/import/older && ls -lR data/import
      - uses: actions/cache/restore@v4
        with:
          path: backend/data/exports
          key: kordis-exports-${{ github.run_id }}
          restore-keys: kordis-exports-
      - name: Download the current export, keep the earlier ones
        run: |
          mkdir -p data/exports/history
          curl -fsSL -D data/headers.txt -o data/gtfs.zip https://kordis-jmk.cz/gtfs/gtfs.zip
          # every export seen before that differs from the current one goes to history, once
          # (previous.zip: caches from before the history; data/import: a manually restored cache)
          for f in data/exports/latest.zip data/exports/previous.zip $(find data/import -name '*.zip' 2>/dev/null); do
            [ -f "$f" ] && ! cmp -s "$f" data/gtfs.zip || continue
            cp -p "$f" "data/exports/history/$(sha256sum "$f" | cut -c1-16).zip"
          done
          rm -f data/exports/previous.zip
          cp data/gtfs.zip data/exports/latest.zip
          tr -d '\r' < data/headers.txt | sed -n 's/^last-modified: //Ip' > data/exports/latest.modified
          # the four most recent earlier exports
          ls -t data/exports/history/*.zip 2>/dev/null | tail -n +5 | xargs -r rm
          ls -l data/exports data/exports/history
      - name: Build timetable database from the current GTFS feed
        run: npm run build-db -- --source data/gtfs.zip --prev-source "$(ls -t data/exports/history/*.zip 2>/dev/null | paste -sd, -)"
      - uses: actions/cache/save@v4
        with:
          path: backend/data/exports
          key: kordis-exports-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - run: docker build -t "$IMAGE" . && docker push "$IMAGE"
      - name: Deploy
        run: >
          gcloud run deploy mhd-api
          --image "$IMAGE"
          --region ${{ vars.GCP_REGION }}
          --allow-unauthenticated
          --min-instances 0 --max-instances 1
          --cpu 1 --memory 512Mi --concurrency 20 --timeout 10
          --set-secrets API_KEY=mhd-api-key:latest
          --service-account mhd-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          --quiet
